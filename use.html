<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <nav>
    <span class="logo">⬡ FraudNotes</span>
    <a href="use.html" id="nav-use">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Use
    </a>
    <a href="create.html" id="nav-create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Manage
    </a>
  </nav>

  <div class="page active">

    <!-- Script Picker -->
    <div class="card">
      <div class="card-header">
        <h3>Script</h3>
      </div>
      <div class="card-body">
        <select id="script-select"></select>
      </div>
    </div>

    <!-- Fields -->
    <div class="card">
      <div class="card-header">
        <h3>Fill In</h3>
        <button class="btn btn-ghost btn-sm" id="btn-clear">Clear</button>
      </div>
      <div class="card-body">
        <div id="fields-empty" class="empty-state">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Select a script to get started
        </div>
        <div id="fields-container"></div>
      </div>
    </div>

    <!-- Preview -->
    <div class="card">
      <div class="card-header">
        <h3>Preview</h3>
        <div class="row" style="gap:8px">
          <button class="btn btn-primary btn-sm" id="btn-copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="preview-text" id="preview">
          <span style="color:var(--text-dim);font-style:italic;">Select a script above to see the note preview.</span>
        </div>
      </div>
    </div>

  </div><!-- /page -->
</div><!-- /app -->

<div id="toast"></div>
<script src="app.js"></script>
<script src="use.js"></script>
</body>
</html>
